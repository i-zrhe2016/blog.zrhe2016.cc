name: Build blog

on:
  push:
    branches: [main, preview]
  pull_request:
  schedule:
    # 06:17 Asia/Shanghai (GitHub schedules use UTC and may be delayed).
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build blog
        run: pnpm build
        env:
          WORKERS_CI_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
      - name: Deploy production Worker
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: pnpm exec wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload preview Worker version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/preview'
        run: pnpm exec wrangler versions upload --preview-alias preview --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: blog-dist
          path: dist/
          if-no-files-found: error
